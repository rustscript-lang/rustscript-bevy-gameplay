[package]
name = "rustscript-bevy-gameplay"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
bevy_ecs = "0.18.1"
pd-host-function = { git = "https://github.com/rustscript-lang/rustscript", rev = "b1d6cffede77f49410bf63525f30b9a46b02dc01" }
vm = { package = "pd-vm", git = "https://github.com/rustscript-lang/rustscript", rev = "b1d6cffede77f49410bf63525f30b9a46b02dc01", default-features = false, features = ["runtime", "cranelift-jit"] }

[dev-dependencies]
bevy = { version = "0.18.1", default-features = false, features = ["default_app", "bevy_winit", "x11", "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_sprite_render", "bevy_text", "bevy_ui", "bevy_ui_render", "default_font", "png"] }
bevy_egui = "0.39.1"
fontdb = "0.23"
pretty_assertions = "1"
rfd = "0.17.2"
