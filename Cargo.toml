[package]
name = "rustscript-bevy-gameplay"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
bevy_ecs = "0.18.1"
pd-host-function = { git = "https://github.com/rustscript-lang/rustscript", rev = "805991cfc6d81e7b9d6c042a222ecf70e3f2dab0" }
vm = { package = "pd-vm", git = "https://github.com/rustscript-lang/rustscript", rev = "805991cfc6d81e7b9d6c042a222ecf70e3f2dab0", default-features = false, features = ["runtime"] }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vm = { package = "pd-vm", git = "https://github.com/rustscript-lang/rustscript", rev = "805991cfc6d81e7b9d6c042a222ecf70e3f2dab0", default-features = false, features = ["cranelift-jit"] }

[dev-dependencies]
bevy = { version = "0.18.1", default-features = false, features = ["default_app", "bevy_winit", "x11", "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_sprite_render", "bevy_text", "bevy_ui", "bevy_ui_render", "default_font", "png"] }
bevy_egui = "0.39.1"
pretty_assertions = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
fontdb = "0.23"
rfd = "0.17.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
bevy = { version = "0.18.1", default-features = false, features = ["webgl2"] }
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[profile.web-release]
inherits = "release"
opt-level = "s"
debug = false
